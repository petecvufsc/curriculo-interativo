# Publica o site no GitHub Pages a cada envio para a branch "main".
# Antes de publicar, roda os testes: se algum falhar, o site NÃO é atualizado.
# Pré-requisito (uma vez): no repositório, Settings > Pages > Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar à mão, na aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
